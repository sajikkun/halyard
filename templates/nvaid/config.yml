# nvaid project config — HAND-OWNED. `nvaid update` never overwrites this file.
#
# This is the one place a repo declares who and what it is in the AI-DLC workflow:
#   - which coding agents nvaid targets here,
#   - what tier/role this repo plays,
#   - the full tech stack of the project,
#   - who the named architects are that sign off on each contract,
#   - the always-on project context every agent should carry.
#
# Written by `nvaid init`, then yours to maintain. The skills and slash commands read
# this file to know, for example, who a drafted contract is "awaiting sign-off" from.

schema: nvaid/v1

# Installation gate. `nvaid init` scaffolds empty templates; the /nvaid:install SKILL
# then scans the project and fills in all three required documents. The workflow commands
# (/nvaid:intent, :contracts, :breakdown, :apply) are BLOCKED until install is complete —
# running them against unfilled templates would produce hollow, confidently-wrong output.
#
# Each flag is set to true by /nvaid:install only once that document is genuinely filled
# (not left as <placeholder> template text) and a human has confirmed it. The install is
# "complete" when all three are true.
install:
  config: false              # project_name, owning_repo, tech_stack, architects all set
  project_rules: false       # nvaid/PROJECT-RULES.md authored (not the template skeleton)
  design_code_dictionary: false  # nvaid/DESIGN-CODE-DICTIONARY.md authored (not the skeleton)

# A short name for this project/repo, used in generated artifact headers
# (replaces the {{PROJECT_NAME}} placeholder in PROJECT-RULES.md and the dictionary).
project_name: "<set-me>"

# Which repo this is in the family — used to tag the units this repo owns when a
# unit-breakdown is cut. (Intent folders are prefixed with the repo NAME, e.g.
# `shop-backend.`, not this value — family-rules.md rule 14.) One of:
# frontend | backend | platform | <other>.
owning_repo: "<set-at-init>"

# The repo family these shared rules coordinate across (nvaid/rules/family-rules.md 14/15).
# Set this EXPLICITLY — the family-wide Intent/ADR numbering checks resolve siblings from
# here, NOT from a blanket `gh repo list <owner>` (which would wrongly pull in unrelated
# repos, including nvaid itself and any future non-family project).
family:
  owner: ""            # org/owner that holds the board + repos (e.g. "acme")
  project_board: ""    # the shared tracker board number these rules coordinate on (e.g. "19")
  repos: []            # explicit family members, e.g.
                       #   ["acme/shop-frontend", "acme/shop-backend"]
  # github_topic: ""   # alternative to `repos`: resolve the family by a GitHub topic

# The full tech stack of this project. This is the STRUCTURED, machine-readable source of
# truth that agents and the CLI key off — e.g. a skill checks `languages` before proposing
# a dependency, or picks the right test command from `test`. Keep it factual and short;
# the narrative "why we chose this / how it fits together" belongs in
# nvaid/DESIGN-CODE-DICTIONARY.md, which references this block rather than repeating it.
#
# Leave a field blank or omit it if it doesn't apply. `additional` is an open map for
# anything the fixed fields don't cover (message brokers, infra, cloud, auth providers…).
tech_stack:
  languages: []                 # e.g. ["TypeScript", "Python"]
  runtime: ""                   # e.g. "Node >=18", "Python 3.12"
  frameworks: []                # e.g. ["React", "FastAPI"]
  package_manager: ""           # e.g. "npm", "pnpm", "uv", "poetry"
  build: ""                     # e.g. "Vite", "tsup", "hatch"
  test: ""                      # e.g. "Vitest", "pytest"
  lint_format: ""               # e.g. "eslint + prettier", "ruff"
  database: ""                  # e.g. "PostgreSQL 16", "none"
  deploy: ""                    # e.g. "Docker + Kubernetes", "GitHub Pages"
  additional: {}                # e.g. { cache: "Redis", broker: "RabbitMQ", auth: "OIDC" }

# Named architects who sign off on each role's Architecture Contract.
#
# These are SIGN-OFF / OWNERSHIP identities: the person accountable for approving that
# contract. The AI drafts contracts and flags them "awaiting <role> sign-off from <name>";
# it never signs on their behalf (propose, don't dispose). Leave a role blank/null if this
# repo doesn't have that architect — a contract for a missing role is simply not pulled in.
architects:
  solutions: "<name>"            # Solutions Architect
  frontend: "<name>"             # Frontend / Identity-Access Architect (if this repo has a frontend)
  backend: "<name>"              # Backend Solutions Architect (if this repo has a backend)
  quality: "<name>"              # Quality Architect
  customer_experience: "<name>"  # Customer Experience Architect (BA / PM)
  # add any project-specific roles here, e.g.:
  # devops: "<name>"

# Coding agents nvaid injected skills into. `nvaid update` regenerates exactly these.
# Managed by init/update; change via `nvaid init` rather than by hand.
agents: []

# Optional project context passed to every agent — constraints an agent can't infer
# from the code. Keep discoverable codebase facts OUT (same discipline as openspec).
# The project's full guardrails live in nvaid/PROJECT-RULES.md (fill in that template);
# this field is just the short, always-on context.
# Example:
#   context: |
#     On-premises only. No cloud targets.
#     See nvaid/PROJECT-RULES.md for the approved stack and gates.
context: ""

# nvaid version this repo was last generated against. `nvaid validate` compares the
# installed CLI version to this and flags drift.
generated_with: "0.3.2"
